# Temporary FREE-MODE worker — scheduled, time-bounded queue worker sessions.
#
# This is development/demo infrastructure, NOT the production architecture. In
# production the worker is an always-on Render background service defined in
# render.yaml. Render's Free tier does not offer background workers or cron jobs,
# so free mode instead wakes the EXISTING worker here on a schedule, lets it drain
# the durable Postgres queue for a bounded window, then stops it gracefully.
#
# Nothing about the queue changes: the same src/worker/main.ts runs, keeping the
# durable PostgreSQL queue, leases, retries and dead-letter behaviour. This file
# only bounds how long a session runs and how often one starts. See
# docs/deploy-free.md for the full runbook, cost model and how to switch back to
# the paid always-on worker.
#
# Overlap is safe by construction: claims use FOR UPDATE SKIP LOCKED and every
# settlement is guarded on locked_by, so if one session overruns into the next
# they cannot double-process a row. cancel-in-progress is therefore false — an
# overrunning session is allowed to finish draining rather than being killed.

name: worker (free mode)

on:
  # GitHub's minimum cron granularity is 5 minutes. Scheduled runs are best-effort
  # and can be delayed or dropped under load, so treat pickup latency as ~5-15 min
  # between sessions (see docs/deploy-free.md "Expected worker latency").
  schedule:
    - cron: "*/5 * * * *"
  # Manual trigger for testing / on-demand draining.
  workflow_dispatch:

# One free-mode worker session at a time. cancel-in-progress: false lets an
# overrunning session finish its graceful drain instead of being killed mid-job
# (a hard kill would strand that job's lease until it lapses ~15 min later).
concurrency:
  group: worker-free
  cancel-in-progress: false

# Least privilege: the job only reads the checkout. It never writes back to the
# repo and never needs a token beyond reading source.
permissions:
  contents: read

jobs:
  worker:
    name: bounded worker session
    runs-on: ubuntu-latest
    # Hard ceiling on the whole job. The worker window is ~4 min; the rest is
    # checkout/install/build. 10 min leaves generous headroom without letting a
    # wedged run bill indefinitely.
    timeout-minutes: 10

    # Scope the DATABASE_URL / CREDENTIAL_ENCRYPTION_KEY secrets to this
    # environment so the CI workflow (ci.yml) and any pull_request run cannot read
    # them. Configure the secrets under Settings > Environments > worker-free.
    environment: worker-free

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # pnpm must be set up BEFORE setup-node so setup-node's `cache: pnpm` can
      # locate the store. No explicit version: pnpm/action-setup reads
      # packageManager (pnpm@11.4.0) from package.json — same as ci.yml.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          # package.json pins engines.node to ">=24.0.0 <25".
          node-version: "24"
          cache: pnpm

      # --frozen-lockfile fails rather than silently resolving a different tree
      # when pnpm-lock.yaml is stale — identical to ci.yml. devDependencies are
      # required here because the next step builds with tsc + tsc-alias.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Compile to dist/. The bounded run below executes the built entrypoint with
      # plain node, exactly like production (dist/worker/main.js).
      - name: Build
        run: pnpm build

      # Optional, additive configuration for v2 credential encryption and the GitHub
      # OAuth provider. These are injected into $GITHUB_ENV for the bounded worker
      # step below ONLY when actually configured.
      #
      # Why not just add them to the worker step's `env:` block like the others: the
      # backend's Zod env parser distinguishes an ABSENT optional variable from one
      # explicitly set to an EMPTY STRING. `${{ secrets.X }}` for an unset secret
      # expands to "", which would (a) fail CREDENTIAL_ENCRYPTION_KEYS validation
      # (.min(1)) and (b) half-enable the GitHub provider. So each value is forwarded
      # only when non-empty; when all are unset this step is a no-op and the worker
      # runs exactly as before — legacy CREDENTIAL_ENCRYPTION_KEY only, Slack
      # unaffected, every other behaviour unchanged.
      #
      # Secret-safe: values are read into step-scoped env, tested with -n only, and
      # written to $GITHUB_ENV via the masked multiline form — never echoed to stdout,
      # no `set -x`. GitHub Actions reserves the `GITHUB_` prefix for secret/variable
      # names, so the OAuth client is configured under Actions names OAUTH_GH_CLIENT_ID
      # (a worker-free VARIABLE, non-secret) and OAUTH_GH_CLIENT_SECRET (a worker-free
      # SECRET, auto-masked), and this step forwards them to the app's runtime names
      # GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET. CREDENTIAL_ENCRYPTION_KEYS is also a
      # worker-free SECRET. The only stdout is a presence/absence line (never a value),
      # which is what lets an operator verify a phase safely.
      - name: Resolve optional OAuth + keyring configuration
        env:
          OPT_CREDENTIAL_ENCRYPTION_KEYS: ${{ secrets.CREDENTIAL_ENCRYPTION_KEYS }}
          OPT_GITHUB_CLIENT_ID: ${{ vars.OAUTH_GH_CLIENT_ID }}
          OPT_GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GH_CLIENT_SECRET }}
        run: |
          # Multi-key keyring (optional). Forwarded only when set, so the backend sees
          # it as ABSENT (not "") otherwise and keeps legacy CREDENTIAL_ENCRYPTION_KEY
          # behaviour. The value MUST include a `legacy-v1:` entry carrying the current
          # key's bytes (see docs/deploy-free.md) or the API/worker refuse to boot.
          if [ -n "${OPT_CREDENTIAL_ENCRYPTION_KEYS}" ]; then
            {
              echo "CREDENTIAL_ENCRYPTION_KEYS<<__WORKER_ENV_EOF__"
              echo "${OPT_CREDENTIAL_ENCRYPTION_KEYS}"
              echo "__WORKER_ENV_EOF__"
            } >> "${GITHUB_ENV}"
            echo "keyring: CREDENTIAL_ENCRYPTION_KEYS provided (v2 active key available)"
          else
            echo "keyring: CREDENTIAL_ENCRYPTION_KEYS not set (legacy CREDENTIAL_ENCRYPTION_KEY only)"
          fi

          # GitHub OAuth client (optional, BOTH-OR-NEITHER). A half-configured pair is
          # refused here with a non-secret diagnostic, so the worker never boots a
          # partially-wired provider (the backend also enforces this via env Invariant 8).
          id_set=false
          secret_set=false
          if [ -n "${OPT_GITHUB_CLIENT_ID}" ]; then id_set=true; fi
          if [ -n "${OPT_GITHUB_CLIENT_SECRET}" ]; then secret_set=true; fi
          if [ "${id_set}" != "${secret_set}" ]; then
            echo "::error::OAUTH_GH_CLIENT_ID (variable) and OAUTH_GH_CLIENT_SECRET (secret) must be set together for the worker-free environment (both or neither)."
            exit 1
          fi
          if [ "${id_set}" = "true" ]; then
            {
              echo "GITHUB_CLIENT_ID<<__WORKER_ENV_EOF__"
              echo "${OPT_GITHUB_CLIENT_ID}"
              echo "__WORKER_ENV_EOF__"
              echo "GITHUB_CLIENT_SECRET<<__WORKER_ENV_EOF__"
              echo "${OPT_GITHUB_CLIENT_SECRET}"
              echo "__WORKER_ENV_EOF__"
            } >> "${GITHUB_ENV}"
            echo "github oauth: client id + secret provided (provider will be enabled)"
          else
            echo "github oauth: client id/secret not set (GitHub provider disabled)"
          fi

      # Run ONE bounded worker session, then stop gracefully.
      #
      # The worker polls forever (it does not exit when the queue drains), so the
      # session is bounded externally by `timeout`:
      #   * at 240s (~4 min) timeout sends SIGTERM;
      #   * src/worker/main.ts handles SIGTERM -> stops claiming, drains the
      #     in-flight job (WORKER_SHUTDOWN_TIMEOUT_MS), hands its lease back to
      #     `pending`, closes the pool, and exits 0;
      #   * --kill-after=30s sends SIGKILL only if that graceful shutdown wedges,
      #     which is a genuine red signal rather than silent data loss;
      #   * --preserve-status makes this step report the WORKER's real exit code
      #     (0 on the clean path), not timeout's own 124, so a healthy drain is a
      #     green run.
      #
      # This step does NOT run database migrations — migrations are applied once,
      # out of band, on the API/database side (see docs/deploy-free.md). Keeping
      # migration ownership on one side prevents the API and worker from racing to
      # apply the same migration.
      #
      # Env notes:
      #   * NODE_ENV=production + HOST=0.0.0.0: the worker binds no port but runs
      #     the SAME production env validation as the API, which refuses a loopback
      #     HOST at boot — so HOST must be non-loopback here too.
      #   * APP_ORIGIN: that same production validation also demands a public
      #     https:// origin (never loopback), because the API builds verification
      #     and password-reset links from it. The worker sends no email, but it
      #     shares one env schema with the API, so the value must be present here
      #     too — set to the public API origin on Render.
      #   * DATABASE_URL and CREDENTIAL_ENCRYPTION_KEY come from the worker-free
      #     environment secrets; they are never hard-coded and never echoed.
      #     CREDENTIAL_ENCRYPTION_KEY MUST match the value configured for the API
      #     on Render — the worker decrypts connection credentials the API
      #     encrypted, so a mismatch makes every stored credential unreadable.
      #   * DATABASE_POOL_MAX=5: Neon Free caps connections tightly; the API and
      #     any overlapping worker session share that ceiling.
      #   * LOG_LEVEL=info: structured operational logs without per-SQL debug noise.
      #   * ANTHROPIC_AUTH_TOKEN / ANTHROPIC_BASE_URL / ANTHROPIC_MODEL point the
      #     worker at the Anthropic-compatible gateway so llm steps can run. The
      #     token is a worker-free environment secret; BASE_URL and MODEL are
      #     worker-free environment variables. AUTH_TOKEN and API_KEY are mutually
      #     exclusive at boot — set only the bearer token here, never both.
      - name: Run a bounded worker session
        env:
          NODE_ENV: production
          HOST: 0.0.0.0
          APP_ORIGIN: https://automation-7d1c.onrender.com
          LOG_LEVEL: info
          DATABASE_POOL_MAX: "5"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: |
          timeout --signal=SIGTERM --kill-after=30s --preserve-status 240s \
            node dist/worker/main.js

      # Best-effort keep-alive for the Render Free API (optional; piggybacks this
      # already-scheduled run — no second workflow, no extra runner).
      #
      # Render Free spins a web service down after ~15 minutes without inbound
      # traffic; the next request then pays a cold start. This job wakes about
      # every 5 minutes anyway, so one lightweight GET keeps the API warm.
      #
      # BEST-EFFORT, NOT A GUARANTEE: GitHub scheduled workflows can be delayed or
      # dropped, so a window may be missed and the service may still sleep. For a
      # hard warm-up SLA use an external uptime monitor or the paid always-on
      # service (see docs/deploy-free.md).
      #
      # Rules baked in here:
      #   * Runs only when the RENDER_API_URL Actions variable is set (repo- or
      #     worker-free-environment-scoped). Unset -> logs "skipped" and succeeds.
      #     No Render URL is hard-coded in this repo.
      #   * Hits the PUBLIC, unauthenticated, DB-free /healthz only. Never sends a
      #     credential, never touches /v1/* or /readyz (which would open a Neon
      #     connection just to keep Render warm).
      #   * if: always() plus a short-timeout curl whose failure is swallowed, so
      #     it runs even if the worker step failed and never fails the job itself.
      #     Logs whether it was attempted/skipped and the HTTP result — never a
      #     credential (none is used).
      - name: Keep-alive ping (best-effort)
        if: always()
        env:
          RENDER_API_URL: ${{ vars.RENDER_API_URL }}
        run: |
          if [ -z "${RENDER_API_URL}" ]; then
            echo "keep-alive: skipped (RENDER_API_URL not set)"
            exit 0
          fi
          url="${RENDER_API_URL%/}/healthz"
          echo "keep-alive: GET ${url}"
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            --connect-timeout 10 --max-time 25 "${url}" || true)"
          if [ -n "${code}" ] && [ "${code}" != "000" ]; then
            echo "keep-alive: HTTP ${code} (service reached)"
          else
            echo "keep-alive: no HTTP response within timeout (ignored)"
          fi
          exit 0
